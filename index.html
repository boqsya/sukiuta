<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>すきなうた</title>
  <style>
    :root{
      --bg:#f6f6f4;
      --card:#fff;
      --text:#191919;
      --muted:#777;
      --line:#deded8;
      --accent:#222;
      --danger:#b3261e;
      --green:#dff0df;
      --greenText:#174d24;
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-text-size-adjust:100%;
    }
    .wrap{
      max-width:720px;
      margin:0 auto;
      padding:calc(18px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
    }
    h1{font-size:30px;margin:0 0 6px}
    .sub{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.55}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:16px;
      margin-bottom:14px;
    }
    label{display:block;font-weight:700;font-size:15px;margin:0 0 7px}
    input, textarea, select{
      width:100%;
      border:1px solid #cfcfc8;
      border-radius:14px;
      background:#fff;
      color:var(--text);
      font-size:18px;
      padding:13px 14px;
      outline:none;
      appearance:none;
    }
    textarea{min-height:84px;resize:vertical;line-height:1.5}
    select{
      font-size:15px;
      padding:10px 12px;
      background:#fff;
    }
    .field{margin-bottom:14px}
    .song-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) 74px;
      gap:8px;
      align-items:end;
    }
    .song-row .field{margin-bottom:0}
    button{
      border:0;
      border-radius:14px;
      padding:14px 16px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .full{width:100%}
    .primary{background:var(--accent);color:#fff}
    .secondary{background:#ecece8;color:var(--text)}
    .danger{background:#fff1f0;color:var(--danger);border:1px solid #f0c8c5}
    .toggle{
      width:74px;
      min-width:74px;
      white-space:nowrap;
      background:#ecece8;
      color:var(--text);
      border:1px solid #d5d5cf;
      padding-left:8px;
      padding-right:8px;
    }
    .toggle.on{
      background:var(--green);
      color:var(--greenText);
      border-color:#bdd8bf;
    }
    .hidden{display:none !important}
    .section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }
    .section-head h2{margin:0;font-size:20px}
    .count{font-size:14px;color:#444}
    .list-toggle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      text-align:left;
      background:#fff;
      color:var(--text);
      border:1px solid #cfcfc8;
    }
    .sort-wrap{
      display:grid;
      grid-template-columns:auto 1fr;
      gap:10px;
      align-items:center;
      margin-bottom:8px;
    }
    .sort-wrap span{font-size:14px;color:#555}
    .song{
      border-top:1px solid var(--line);
      padding:13px 0;
    }
    .song:first-of-type{border-top:0}
    .song-main{
      display:grid;
      grid-template-columns:minmax(0,1fr) 92px;
      gap:10px;
      align-items:start;
    }
    .song-text{min-width:0}
    .song-title{font-size:18px;font-weight:800;margin-bottom:4px;overflow-wrap:anywhere}
    .artist{font-size:15px;color:#444;margin-bottom:6px;overflow-wrap:anywhere}
    .memo{font-size:14px;line-height:1.55;color:#555;white-space:pre-wrap}
    .song-icon-actions{
      display:flex;
      gap:6px;
      justify-content:flex-end;
      align-items:center;
    }
    .icon-btn{
      width:42px;
      height:42px;
      padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f1f1ed;
      color:#2b2b2b;
      border:1px solid #d8d8d1;
      border-radius:12px;
    }
    .delete-btn{
      background:#fff1f0;
      color:var(--danger);
      border-color:#f0c8c5;
    }
    .edit-icon,.trash-icon{width:22px;height:22px;display:block}
    .empty{color:var(--muted);text-align:center;padding:12px 6px}
    .output{font-size:15px;line-height:1.65;min-height:210px}
    .backup-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:12px;
    }
    .toast{
      position:fixed;
      left:50%;
      bottom:calc(24px + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      background:rgba(0,0,0,.86);
      color:#fff;
      padding:10px 16px;
      border-radius:999px;
      font-size:14px;
      opacity:0;
      pointer-events:none;
      transition:.2s;
      z-index:30;
    }
    .toast.show{opacity:1}
    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.48);
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .modal{
      width:min(100%,520px);
      background:#fff;
      border-radius:20px;
      padding:18px;
      box-shadow:0 18px 50px rgba(0,0,0,.25);
    }
    .modal-title{font-size:21px;font-weight:800;margin-bottom:8px}
    .modal-text{font-size:15px;line-height:1.6;color:#555;margin-bottom:12px}
    .modal textarea{min-height:96px}
    @media(max-width:520px){
      .song-row{grid-template-columns:minmax(0,1fr) 70px}
      .toggle{width:70px;min-width:70px;font-size:16px}
      .backup-actions{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<main class="wrap">
  <h1>すきなうた</h1>
  <p class="sub">好きな曲をためて、ChatGPTに渡すためのシンプルな記録アプリです。</p>

  <section class="card">
    <div class="field">
      <label for="artist">アーティスト</label>
      <input id="artist" type="text" placeholder="例：バクチク" autocomplete="off">
    </div>

    <div class="song-row">
      <div class="field">
        <label for="song">曲名</label>
        <input id="song" type="text" placeholder="例：ムーンライト" autocomplete="off">
      </div>
      <button id="memoToggle" type="button" class="toggle" aria-pressed="false">追記</button>
    </div>

    <div id="memoWrap" class="field hidden" style="margin-top:12px">
      <textarea id="memo" placeholder="例：イントロが好き、サビへの入りがかっこいい"></textarea>
    </div>

    <button id="addBtn" class="primary full" style="margin-top:14px">この曲を追加</button>
  </section>

  <section class="card">
    <button id="listToggleBtn" class="list-toggle full">
      <span>登録した曲</span>
      <span id="count" class="count">0曲</span>
    </button>

    <div id="listArea" class="hidden" style="margin-top:12px">
      <div class="sort-wrap">
        <span>並べ替え</span>
        <select id="sortSelect">
          <option value="registered">登録順</option>
          <option value="artist">アーティスト別</option>
          <option value="song">曲名別</option>
        </select>
      </div>
      <div id="songList"></div>
    </div>

    <textarea id="output" class="output hidden" readonly></textarea>

    <button id="showBtn" class="primary full" style="margin-top:12px">ChatGPTへ渡す</button>
  </section>

  <section class="card">
    <div class="section-head">
      <h2>バックアップ</h2>
    </div>
    <div class="backup-actions">
      <button id="backupBtn" class="secondary">バックアップ保存</button>
      <button id="restoreBtn" class="secondary">バックアップ復元</button>
    </div>
    <input id="restoreInput" type="file" accept=".json,application/json" class="hidden">
  </section>

  <section class="card">
    <button id="clearBtn" class="danger full">登録曲をすべて削除</button>
  </section>
</main>

<div id="duplicateModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="dupTitle">
  <div class="modal">
    <div id="dupTitle" class="modal-title">登録済です。</div>
    <div class="modal-text">別バージョンの場合は違いがわかる追記を入力してください。</div>
    <textarea id="duplicateMemo" placeholder="例：ライブ版、別ミックス、アコースティック版"></textarea>
    <button id="duplicateRegisterBtn" class="primary full" style="margin-top:12px">この内容で登録</button>
    <button id="duplicateCancelBtn" class="secondary full" style="margin-top:8px">登録しない</button>
  </div>
</div>

<div id="toast" class="toast">コピーしました</div>

<script>
(() => {
  const STORAGE_KEY = "sukiuta_v2_data";
  const LEGACY_KEY = "sukiuta_v1_songs";

  let state = loadState();
  let editingId = null;
  let memoOpen = false;
  let sortMode = "registered";

  const artistEl = document.getElementById("artist");
  const songEl = document.getElementById("song");
  const memoEl = document.getElementById("memo");
  const memoWrap = document.getElementById("memoWrap");
  const memoToggle = document.getElementById("memoToggle");
  const addBtn = document.getElementById("addBtn");
  const listToggleBtn = document.getElementById("listToggleBtn");
  const listArea = document.getElementById("listArea");
  const sortSelect = document.getElementById("sortSelect");
  const listEl = document.getElementById("songList");
  const countEl = document.getElementById("count");
  const outputEl = document.getElementById("output");
  const showBtn = document.getElementById("showBtn");
  const backupBtn = document.getElementById("backupBtn");
  const restoreBtn = document.getElementById("restoreBtn");
  const restoreInput = document.getElementById("restoreInput");
  const clearBtn = document.getElementById("clearBtn");
  const toastEl = document.getElementById("toast");

  const duplicateModal = document.getElementById("duplicateModal");
  const duplicateMemo = document.getElementById("duplicateMemo");
  const duplicateRegisterBtn = document.getElementById("duplicateRegisterBtn");
  const duplicateCancelBtn = document.getElementById("duplicateCancelBtn");

  function newId() {
    return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.songs)) {
          parsed.pendingDeletes = Array.isArray(parsed.pendingDeletes) ? parsed.pendingDeletes : [];
          parsed.songs = parsed.songs.map((x, i) => ({
            id: x.id || newId(),
            artist: String(x.artist || ""),
            song: String(x.song || ""),
            memo: String(x.memo || ""),
            sent: Boolean(x.sent),
            createdAt: x.createdAt || new Date(Date.now() + i).toISOString()
          }));
          return parsed;
        }
      }

      const legacyRaw = localStorage.getItem(LEGACY_KEY);
      if (legacyRaw) {
        const legacy = JSON.parse(legacyRaw);
        if (Array.isArray(legacy)) {
          return {
            version: 2,
            songs: legacy.map((x, i) => ({
              id: x.id || newId(),
              artist: String(x.artist || ""),
              song: String(x.song || ""),
              memo: String(x.memo || ""),
              sent: false,
              createdAt: x.createdAt || new Date(Date.now() + i).toISOString()
            })),
            pendingDeletes: []
          };
        }
      }
    } catch {}
    return {version:2, songs:[], pendingDeletes:[]};
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  function norm(s) {
    return String(s || "").trim().toLocaleLowerCase("ja-JP")
      .replace(/[\s　・･\-_ー]/g, "");
  }

  function setMemoOpen(open) {
    memoOpen = open;
    memoWrap.classList.toggle("hidden", !open);
    memoToggle.classList.toggle("on", open);
    memoToggle.setAttribute("aria-pressed", String(open));
    memoToggle.textContent = open ? "追記 ✓" : "追記";
    if (open) setTimeout(() => memoEl.focus(), 0);
  }

  function resetForm() {
    artistEl.value = "";
    songEl.value = "";
    memoEl.value = "";
    editingId = null;
    addBtn.textContent = "この曲を追加";
    setMemoOpen(false);
  }

  function getSortedSongs() {
    const arr = [...state.songs];
    if (sortMode === "artist") {
      arr.sort((a,b) =>
        a.artist.localeCompare(b.artist, "ja") ||
        a.song.localeCompare(b.song, "ja") ||
        a.createdAt.localeCompare(b.createdAt)
      );
    } else if (sortMode === "song") {
      arr.sort((a,b) =>
        a.song.localeCompare(b.song, "ja") ||
        a.artist.localeCompare(b.artist, "ja") ||
        a.createdAt.localeCompare(b.createdAt)
      );
    } else {
      arr.sort((a,b) => a.createdAt.localeCompare(b.createdAt));
    }
    return arr;
  }

  function renderList() {
    countEl.textContent = `${state.songs.length}曲`;
    const songs = getSortedSongs();

    if (!songs.length) {
      listEl.innerHTML = `<div class="empty">まだ曲がありません。</div>`;
      return;
    }

    listEl.innerHTML = songs.map(item => `
      <div class="song">
        <div class="song-main">
          <div class="song-text">
            <div class="song-title">${esc(item.song)}</div>
            <div class="artist">${esc(item.artist)}</div>
          </div>
          <div class="song-icon-actions">
            <button class="icon-btn edit-btn" data-id="${item.id}" aria-label="編集" title="編集">
              <svg class="edit-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17.7 3.3a2.4 2.4 0 0 1 3.4 3.4L9.2 18.6 4 20l1.4-5.2L17.7 3.3Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M15.9 5.1 19 8.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="icon-btn delete-btn" data-id="${item.id}" aria-label="削除" title="削除">
              <svg class="trash-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
        ${item.memo ? `<div class="memo">追記：${esc(item.memo)}</div>` : ""}
      </div>
    `).join("");

    document.querySelectorAll(".edit-btn").forEach(btn => {
      btn.addEventListener("click", () => editSong(btn.dataset.id));
    });
    document.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", () => deleteSong(btn.dataset.id));
    });
  }

  function findDuplicates(artist, song) {
    return state.songs.filter(x =>
      x.id !== editingId &&
      norm(x.artist) === norm(artist) &&
      norm(x.song) === norm(song)
    );
  }

  function showDuplicateModal() {
    duplicateMemo.value = "";
    duplicateModal.classList.remove("hidden");
    document.body.style.overflow = "hidden";
    setTimeout(() => duplicateMemo.focus(), 0);
  }

  function hideDuplicateModal() {
    duplicateModal.classList.add("hidden");
    document.body.style.overflow = "";
    duplicateMemo.value = "";
  }

  function addOrUpdate() {
    const artist = artistEl.value.trim();
    const song = songEl.value.trim();
    const memo = memoOpen ? memoEl.value.trim() : "";

    if (!artist) {
      alert("アーティスト名を入れてください。");
      artistEl.focus();
      return;
    }
    if (!song) {
      alert("曲名を入れてください。");
      songEl.focus();
      return;
    }

    if (editingId) {
      const idx = state.songs.findIndex(x => x.id === editingId);
      if (idx >= 0) {
        state.songs[idx] = {
          ...state.songs[idx],
          artist,
          song,
          memo,
          sent:false
        };
      }
      saveState();
      resetForm();
      renderList();
      return;
    }

    if (findDuplicates(artist, song).length) {
      showDuplicateModal();
      return;
    }

    state.songs.push({
      id:newId(),
      artist,
      song,
      memo,
      sent:false,
      createdAt:new Date().toISOString()
    });
    saveState();
    resetForm();
    renderList();
  }

  function editSong(id) {
    const item = state.songs.find(x => x.id === id);
    if (!item) return;
    editingId = id;
    artistEl.value = item.artist;
    songEl.value = item.song;
    memoEl.value = item.memo || "";
    setMemoOpen(Boolean(item.memo));
    addBtn.textContent = "修正を保存";
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function deleteSong(id) {
    const item = state.songs.find(x => x.id === id);
    if (!item) return;
    if (!confirm(`「${item.song}」を削除しますか？`)) return;

    if (item.sent) {
      state.pendingDeletes.push({
        artist:item.artist,
        song:item.song,
        memo:item.memo || ""
      });
    }
    state.songs = state.songs.filter(x => x.id !== id);
    saveState();
    if (editingId === id) resetForm();
    renderList();
  }

  function buildHandoffText() {
    const unsent = state.songs.filter(x => !x.sent);
    const deletes = state.pendingDeletes;

    if (!unsent.length && !deletes.length) return "";

    const lines = [
      "以下は「すきなうた」アプリからの追加・変更分です。",
      "これまで保存している私の好きな曲・好み情報は削除せず、今回の内容を反映してください。",
      "表記ゆれや略称は、確実に判断できるものだけ正式名称として整理してください。",
      "判断できないものは推測せず確認してください。",
      ""
    ];

    if (unsent.length) {
      lines.push("【追加・変更】");
      unsent.forEach(item => {
        lines.push(`- ${item.artist} / ${item.song}`);
        if (item.memo) lines.push(`  追記：${item.memo}`);
      });
      lines.push("");
    }

    if (deletes.length) {
      lines.push("【削除】");
      deletes.forEach(item => {
        lines.push(`- ${item.artist} / ${item.song}`);
        if (item.memo) lines.push(`  追記：${item.memo}`);
      });
      lines.push("");
    }

    lines.push(
      "【お願い】",
      "・既存の好み情報を維持したまま今回分を追加・更新してください。",
      "・今後セットリストを頼んだときは、これまで蓄積した登録曲全体から流れを重視して組んでください。"
    );

    return lines.join("\n");
  }

  async function handoffToChatGPT() {
    const text = buildHandoffText();
    if (!text) {
      alert("新しく渡す曲はありません。");
      return;
    }

    try {
      await navigator.clipboard.writeText(text);
    } catch {
      outputEl.value = text;
      outputEl.classList.remove("hidden");
      outputEl.focus();
      outputEl.select();
      document.execCommand("copy");
      outputEl.classList.add("hidden");
    }

    state.songs = state.songs.map(x => ({...x, sent:true}));
    state.pendingDeletes = [];
    saveState();
    showToast("ChatGPTへ渡す内容をコピーしました");
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 1700);
  }

  function backupData() {
    const data = {
      app:"すきなうた",
      formatVersion:1,
      exportedAt:new Date().toISOString(),
      songs:state.songs,
      pendingDeletes:state.pendingDeletes
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
    a.href = url;
    a.download = `sukiuta_backup_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function restoreData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result || ""));
        if (!data || !Array.isArray(data.songs)) throw new Error("bad");
        if (!confirm(`${data.songs.length}曲のバックアップを復元しますか？\n現在の登録内容は置き換わります。`)) return;

        state = {
          version:2,
          songs:data.songs.map((x, i) => ({
            id:x.id || newId(),
            artist:String(x.artist || ""),
            song:String(x.song || ""),
            memo:String(x.memo || ""),
            sent:Boolean(x.sent),
            createdAt:x.createdAt || new Date(Date.now()+i).toISOString()
          })),
          pendingDeletes:Array.isArray(data.pendingDeletes) ? data.pendingDeletes : []
        };
        saveState();
        resetForm();
        renderList();
        showToast("バックアップを復元しました");
      } catch {
        alert("このバックアップファイルは読み込めません。");
      } finally {
        restoreInput.value = "";
      }
    };
    reader.readAsText(file);
  }

  memoToggle.addEventListener("click", () => setMemoOpen(!memoOpen));
  addBtn.addEventListener("click", addOrUpdate);

  listToggleBtn.addEventListener("click", () => {
    renderList();
    listArea.classList.toggle("hidden");
  });

  sortSelect.addEventListener("change", () => {
    sortMode = sortSelect.value;
    renderList();
  });

  showBtn.addEventListener("click", handoffToChatGPT);

  duplicateRegisterBtn.addEventListener("click", () => {
    const artist = artistEl.value.trim();
    const song = songEl.value.trim();
    const memo = duplicateMemo.value.trim();

    if (!memo) {
      alert("違いがわかる追記を入力してください。");
      duplicateMemo.focus();
      return;
    }

    state.songs.push({
      id:newId(),
      artist,
      song,
      memo,
      sent:false,
      createdAt:new Date().toISOString()
    });
    saveState();
    hideDuplicateModal();
    resetForm();
    renderList();
  });

  duplicateCancelBtn.addEventListener("click", () => {
    hideDuplicateModal();
    resetForm();
  });

  backupBtn.addEventListener("click", backupData);
  restoreBtn.addEventListener("click", () => restoreInput.click());
  restoreInput.addEventListener("change", () => {
    const file = restoreInput.files && restoreInput.files[0];
    if (file) restoreData(file);
  });

  clearBtn.addEventListener("click", () => {
    if (!state.songs.length) return;
    if (!confirm("登録した曲をすべて削除しますか？")) return;
    state.songs = [];
    state.pendingDeletes = [];
    saveState();
    resetForm();
    renderList();
  });

  renderList();
})();
</script>
</body>
</html>
